name: Refresh data
on:
  schedule:
    - cron: "0 14 5 * *"   # 14:00 UTC on the 5th of each month (after FHFA/BLS releases settle)
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build data.json from primary sources
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m pipeline.build
      - name: Validate before committing
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm test
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: monthly refresh $(date -u +%Y-%m-%d)"
            git push
          fi
